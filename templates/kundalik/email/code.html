<!DOCTYPE html>
<html lang="uz">
<body style="margin:0;padding:24px;background:#f4f6fa;font-family:Arial,Helvetica,sans-serif;color:#1f2430;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr><td align="center">
      <table role="presentation" width="100%" style="max-width:480px;background:#ffffff;border:1px solid #eceef2;border-radius:14px;" cellspacing="0" cellpadding="0">
        <tr><td style="padding:28px 28px 8px;font-size:18px;font-weight:bold;">📚 O'qish kundaligi</td></tr>
        <tr><td style="padding:8px 28px;font-size:15px;line-height:1.5;">
          Assalomu alaykum, {{ name }}!<br>
          {{ intro }}
        </td></tr>
        <tr><td align="center" style="padding:18px 28px;">
          <div style="display:inline-block;font-size:32px;font-weight:bold;letter-spacing:8px;background:#eaf0ff;color:#2563eb;padding:14px 22px;border-radius:12px;">{{ code }}</div>
        </td></tr>
        <tr><td style="padding:8px 28px 4px;font-size:13px;color:#6b7280;line-height:1.5;">
          Kod {{ minutes }} daqiqa amal qiladi. {{ ignore_note }}
        </td></tr>
        <tr><td style="padding:16px 28px 28px;font-size:13px;color:#6b7280;">Xiva shahar axborot-kutubxona markazi</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
