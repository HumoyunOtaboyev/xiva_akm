<form method="post" class="resend-form">
  {% csrf_token %}
  <button class="auth-link-btn" type="submit" name="resend" value="1" id="resend-btn"
    data-wait="{{ resend_wait }}"{% if resend_wait %} disabled{% endif %}>
    Kodni qayta yuborish{% if resend_wait %} ({{ resend_wait }} s){% endif %}
  </button>
</form>
<script>
  (function () {
    var btn = document.getElementById("resend-btn");
    var left = Number(btn.dataset.wait) || 0;
    if (!left) return;
    var timer = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = "Kodni qayta yuborish";
      } else {
        btn.textContent = "Kodni qayta yuborish (" + left + " s)";
      }
    }, 1000);
  })();
</script>
